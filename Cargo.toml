[package]
name = "false-sharing-detector"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
walkdir = "2"
quote = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
regex = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
glob = "0.3"
tree-sitter = "0.26.9"
tree-sitter-cpp = "0.23.4"

[dev-dependencies]
tempfile = "3"
